# Read-only cluster-wide. Only what Phase 2 detection + Storage Analysis
# + Best Practices & Security actually read: pods, nodes, events, node
# metrics, PVCs/PVs, the nodes/proxy path (see below), plus
# Deployments/StatefulSets/PodDisruptionBudgets/NetworkPolicies/HPAs for
# the static best-practice checks (replica counts, PDB/HPA/NetworkPolicy
# coverage). No write verbs on anything - this app only ever observes
# and records to its own Postgres, never touches a cluster resource.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-monitor
  namespace: cluster-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-monitor-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Broader than anything else this app is granted, and worth calling
  # out explicitly: nodes/proxy lets the ServiceAccount reach *any*
  # kubelet-exposed HTTP path on any node (RBAC can't scope by
  # sub-path), not just stats/summary - which is the only one
  # k8s_client.py ever calls. There's no narrower supported way to read
  # real PVC usage: PersistentVolumeClaim/PersistentVolume objects only
  # ever carry requested/bound capacity, never how much of it is used -
  # the kubelet's own stats/summary endpoint is the only place that
  # exists. Accepted deliberately for Storage Analysis (see
  # cluster-monitor/README.md); get only, no exec/attach/log verbs.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-monitor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitor-reader
subjects:
  - kind: ServiceAccount
    name: cluster-monitor
    namespace: cluster-monitor
