# Single entrypoint in front of cluster-stats and cluster-monitor,
# routed by path. Needed because both apps independently defined their
# own "/api/cluster/summary" endpoint - merging them into one backend
# would collide; routing by path prefix to two separate backends does
# not. Each app's frontend has a <base href="/stats/"|"/monitor/"> tag
# and uses relative (not "/api/...") fetch paths specifically so this
# works regardless of the browser's address-bar trailing slash - see
# the comments in each app's index.html.

server {
    listen 8000;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Redirect the bare prefix (no trailing slash) to the trailing-slash
    # form - relative-URL resolution in the browser depends on it.
    location = /stats {
        return 301 /stats/;
    }
    location = /monitor {
        return 301 /monitor/;
    }

    # Trailing slash on proxy_pass strips the /stats or /monitor prefix
    # before forwarding, so each backend keeps seeing its own native
    # "/api/..." and "/" paths, unmodified from how it's tested/run
    # standalone.
    location /stats/ {
        proxy_pass http://cluster-stats.cluster-stats.svc.cluster.local:8000/;
        proxy_set_header Host $host;
    }

    location /monitor/ {
        proxy_pass http://cluster-monitor.cluster-monitor.svc.cluster.local:8000/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
