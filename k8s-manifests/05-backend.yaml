# Image is built on buildserver and pushed to its local registry -
# see deploy notes (k8s-manifests/README.md). Cluster nodes' containerd
# already trusts 192.168.56.20:5000 without TLS (provisioning/common.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: observability-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 192.168.56.20:5000/observability-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: obs-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: obs-db-secret, key: DATABASE_URL }
            - name: REDIS_URL
              value: redis://redis:6379/0
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: observability-platform
spec:
  selector:
    app: backend
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
