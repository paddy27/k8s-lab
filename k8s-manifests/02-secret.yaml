# Same "obs"/"obs" local-dev default already used in docker-compose.yml.
# Change these (and re-apply) before this ever points at a real environment.
apiVersion: v1
kind: Secret
metadata:
  name: obs-db-secret
  namespace: observability-platform
type: Opaque
stringData:
  POSTGRES_USER: obs
  POSTGRES_PASSWORD: obs
  DATABASE_URL: postgresql+psycopg2://obs:obs@timescaledb:5432/observability
